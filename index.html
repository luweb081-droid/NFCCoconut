<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Coconut — Choisissez votre univers</title>
  <meta name="description" content="NFC Coconut : plaques NFC & sites web pour les professionnels, ou collection streetwear en édition limitée. Choisissez votre univers.">
  <link rel="icon" type="image/png" href="static/images/ico.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --cream: #ead9b4;
      --font-display: "Cinzel", serif;
      --font-body: "Montserrat", sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0b;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .split-logo {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: min(270px, 32vw);
      filter: brightness(0) invert(1) drop-shadow(0 6px 18px rgba(0,0,0,.5));
      pointer-events: none;
    }

    .split-wrap {
      position: relative;
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .split-panel {
      position: relative;
      flex: 1;
      display: flex;
      overflow: hidden;
      color: #fff;
      text-decoration: none;
      transition: flex .6s var(--ease);
    }

    .split-panel img.split-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.06);
      transition: transform 1.2s var(--ease);
    }

    .split-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.42) 45%, rgba(0,0,0,.55) 100%);
      transition: background .6s ease;
      z-index: 1;
    }

    .split-wrap:hover .split-panel:not(:hover) {
      flex: 0.72;
    }

    .split-wrap:hover .split-panel:not(:hover)::before {
      background: rgba(0,0,0,.72);
    }

    .split-panel:hover img.split-bg { transform: scale(1); }

    /* Bloc unique : badge + titre + texte + bouton, centré au niveau du VS */
    .split-center {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 0 30px;
      text-align: center;
    }

    .split-badge {
      display: inline-block;
      margin-bottom: 16px;
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cream);
      opacity: .9;
    }

    .split-center h2 {
      margin: 0 0 18px;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(1.6rem, 3.4vw, 2.4rem);
      letter-spacing: .5px;
    }

    .split-center p {
      margin: 0 0 26px;
      font-size: .8rem;
      line-height: 1.7;
      font-weight: 300;
      color: rgba(255,255,255,.75);
    }

    .split-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 40px;
      font-size: .64rem;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      transition: background .3s ease, border-color .3s ease, transform .3s var(--ease);
    }

    .split-panel:hover .split-cta {
      background: #fff;
      color: #111;
      border-color: #fff;
      transform: translateY(-3px);
    }

    .split-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255,255,255,.18);
      z-index: 3;
      pointer-events: none;
    }

    .split-vs {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.25);
      backdrop-filter: blur(6px);
      font-family: var(--font-display);
      font-size: .8rem;
      letter-spacing: 1px;
      color: #fff;
      pointer-events: none;
    }

    @media (max-width: 780px) {
      .split-wrap { flex-direction: column; }
      .split-wrap:hover .split-panel:not(:hover) { flex: 1; }
      .split-center { padding: 0 26px; }
      .split-divider { display: none; }
      .split-logo { top: 20px; width: 120px; }
    }
  </style>
</head>
<body>

  <img src="static/images/nfccoconut.png" alt="NFC Coconut" class="split-logo">

  <div class="split-wrap">

    <a href="b2b.html" class="split-panel" aria-label="Accéder à l'espace professionnel">
      <img src="static/images/bcnfc7.png" alt="" class="split-bg">
      <div class="split-center">
        <span class="split-badge">Professionnels</span>
        <h2>Espace Pro</h2>
        <p>Plaques NFC avis Google, présentoirs, cartes de visite connectées et création de sites vitrines.</p>
        <span class="split-cta">Accéder à l'espace pro <i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </a>

    <a href="https://streetwear.nfccoconut.fr" class="split-panel" aria-label="Voir la collection streetwear">
      <img src="static/images/streetwearbis.png" alt="" class="split-bg">
      <div class="split-center">
        <span class="split-badge">Édition limitée</span>
        <h2>Streetwear</h2>
        <p>T-shirts oversized et affiches en série limitée, imprimés en France.</p>
        <span class="split-cta">Voir la collection <i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </a>

    <div class="split-divider"></div>
    <div class="split-vs">OU</div>

  </div>
<script src="static/js/cookies.js" defer></script>
</body>
</html>
