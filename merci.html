<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci — NFC COCONUT</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS Externe -->
    <link rel="stylesheet" href="static/css/style.css">
    
    <link rel="icon" type="image/x-icon" href="static/images/ico.png">
</head>
<body>

    <!-- SEARCH OVERLAY -->
    <div class="search-overlay" id="searchOverlay">
        <input type="search" class="search-input" placeholder="Rechercher un produit" id="searchInput" autocomplete="off">
        <button class="close-search" id="closeSearchBtn" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- DRAWER PANIER / MENU MOBILE -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="cartDrawer">
        <div>
            <div class="drawer-header">
                <h3>Menu & panier</h3>
                <button class="drawer-close" id="closeDrawerBtn" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <nav class="mobile-nav"></nav>
            <div class="drawer-divider"></div>
            <div class="drawer-empty-msg">Votre panier est actuellement vide.</div>
            <div class="cart-items-container"></div>
        </div>
        <button class="btn-checkout" type="button">Commander (0,00 €)</button>
    </aside>

    <!-- EN-TÊTE (Géré dynamiquement par main.js) -->
    <header class="top-header"></header>

    <!-- CONTENU DE LA PAGE MERCI -->
    <main class="page-container" style="text-align: center; padding: 80px 20px;">
        <div class="page-title" style="margin-bottom: 40px;">
            <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: #111; margin-bottom: 20px;"></i>
            <h1>Merci de votre demande</h1>
            <p style="max-width: 600px; margin: 15px auto 0; font-size: 1.1rem; line-height: 1.6;">
                Votre message a bien été transmis à notre équipe. Un conseiller de la Maison NFC COCONUT étudiera votre demande et vous répondra dans les plus brefs délais.
            </p>
        </div>

        <div>
            <a href="/" class="btn-submit" style="display: inline-block; width: auto; padding: 15px 35px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;">
                Retour à l'accueil
            </a>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 NFC COCONUT — TOUS DROITS RÉSERVÉS
    </footer>

    <!-- JavaScript Externe -->
    <script src="static/js/main.js"></script>
    
</body>
</html>
